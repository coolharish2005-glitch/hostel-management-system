{% extends "base.html" %}

{% block title %}Edit Room - Hostel Management System{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <div class="row mb-4">
        <div class="col-md-12">
            <h1 class="page-title">Edit Room</h1>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="form-card">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="hostel_id" class="form-label">Hostel *</label>
                            <select class="form-control" id="hostel_id" name="hostel_id" required disabled>
                                {% for hostel in hostels %}
                                <option value="{{ hostel.id }}" {% if room.hostel_id == hostel.id %}selected{% endif %}>{{ hostel.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="floor_number" class="form-label">Floor Number *</label>
                            <input type="number" class="form-control" id="floor_number" name="floor_number" value="{{ room.floor_number }}" required min="1">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="room_number" class="form-label">Room Number (Read-only)</label>
                            <input type="text" class="form-control" id="room_number" value="{{ room.room_number }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="room_type" class="form-label">Room Type *</label>
                            <select class="form-control" id="room_type" name="room_type" required>
                                <option value="Single" {% if room.room_type == 'Single' %}selected{% endif %}>Single</option>
                                <option value="Double" {% if room.room_type == 'Double' %}selected{% endif %}>Double</option>
                                <option value="Triple" {% if room.room_type == 'Triple' %}selected{% endif %}>Triple</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="capacity" class="form-label">Capacity *</label>
                            <input type="number" class="form-control" id="capacity" name="capacity" value="{{ room.capacity }}" required min="1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="rent" class="form-label">Monthly Rent</label>
                            <input type="number" class="form-control" id="rent" name="rent" value="{{ room.rent }}" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="Available" {% if room.status == 'Available' %}selected{% endif %}>Available</option>
                                <option value="Occupied" {% if room.status == 'Occupied' %}selected{% endif %}>Occupied</option>
                                <option value="Maintenance" {% if room.status == 'Maintenance' %}selected{% endif %}>Maintenance</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Current Occupancy</label>
                            <input type="text" class="form-control" value="{{ room.current_occupancy }}/{{ room.capacity }}" disabled>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ room.description or '' }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Room
                        </button>
                        <a href="{{ url_for('list_rooms') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
